[project]
name = "dromia"
version = "0.1.0"
description = "Expert-guided 2D running gait analysis for crowded sagittal video"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "addict==2.4.0",
    "chumpy==0.70",
    "einops>=0.8,<0.9",
    "huggingface-hub>=1.5,<2",
    "hydra-core>=1.3,<1.4",
    "iopath>=0.1.10,<0.2",
    "json-tricks>=3.17,<4",
    "matplotlib>=3.10,<4",
    "mmcv-lite==2.1.0",
    "mmdet==3.2.0",
    "mmengine==0.10.7",
    "mmpretrain==1.2.0",
    "mlx-vlm==0.6.3",
    "munkres==1.1.4",
    "numpy>=1.26,<2.3",
    "opencv-python==4.13.0.92",
    "pillow>=10",
    "pydantic>=2.7,<3",
    "pycocotools>=2.0.7,<3",
    "scipy>=1.11,<2",
    "sparsemax==0.1.9",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "transformers==5.12.1",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
review = ["cvat-sdk>=2.69,<3"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.15,<1"]

[project.scripts]
dromia = "dromia.cli:main"

[project.urls]
Repository = "https://github.com/carlosgars/dromia"
Issues = "https://github.com/carlosgars/dromia/issues"

[build-system]
requires = ["hatchling>=1.29"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dromia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: requires downloaded model artifacts and Apple Silicon"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.uv.extra-build-dependencies]
chumpy = ["pip", "setuptools"]
